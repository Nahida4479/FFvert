<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFvert</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="FFvert.png" type="image/x-icon">
</head>
<body>

<main style="text-align: center;">

  <section>
  <div id="ffvert_panel">
    <h1 id="FFvert_text">FFvert</h1>
    <div id="dropzone" class="dropzone">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="48" height="48">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="17 8 12 3 7 8"/>
    <line x1="12" y1="3" x2="12" y2="15"/>
  </svg>
  <p id="dropzone-clickordrag">Click or drag video or image file here</p>
  <p class="dropzone-sub" id="dropzone-sub">MP4, MOV, PNG, JPG and more</p>
  <p id="selectedFileName" class="dropzone-sub"></p>
</div>



<input type="file" id="fileinput" accept="video/*, image/*" hidden>

<div id="optionsPanel" class="options-panel" hidden>

  <select id="formatselect" class="select-style">
    <option value="gif">GIF</option>
    <option value="mov">MOV</option>
    <option value="mp3">MP3</option>
    <option value="mp4">MP4</option>
    <option value="avi">AVI</option>
    <option value="MKV">MKV</option>
    <option value="WMV">WMV</option>
  </select>
  <select id="resolutionselect" class="select-style">
    <option value="default">Default file resolution</option>
    <option value="3840x2160">4K (3840x2160 or 2160x3840)</option>
    <option value="2560x1440">1440p (2560x1440 or 1440x2560)</option>
    <option value="1920x1080">1080p (1920x1080 or 1080x1920)</option>
    <option value="1280x720">720p (1280x720 or 720x1280)</option>
    <option value="854x480">480p (854x480 or 480x854)</option>
  </select>
  <button id="conbutton" class="select-style">Convert</button>
  <button id="downloadoutput" class="select-style" hidden>Download</button>

  <div id="progressContainer" class="progress-container">
  <div id="progressBar" class="progress-bar"></div>
  <span id="progressText" class="progress-text"></span>
</div>
<p id="funfact" class="infobox"></p>
</div>
  </div>

  </section>

  <section id="yt-dlp-panel">
    <div id="yt-dlp-background">
      <div id="yt-dlp-text">
        <h1>yt-dlp</h1>
      </div>

      <div id="yt-dlp-link-panel">
        <input type="text" id="yt-dlp-link-button" placeholder=" Your YouTube video link" required>

        <select id="yt-dlp-select">
            <option value="mp4">MP4</option>
            <option value="mp3">MP3</option>
            <option value="mov">MOV</option>
            <option value="gif">GIF</option>
            <option value="mkv">MKV</option>
            <option value="webm">WEBM</option>
            <option value="aac">AAC</option>
            <option value="m4a">M4A</option>
            <option value="flac">FLAC</option>
            <option value="WAV">WAV</option>
            <option value="opus">OPUS</option>
            <option value="vorbis">VORBIS</option>
          </select>
          <select id="yt-dlp-resolution">
            <option value="1440p">1440p</option>
            <option value="1080p">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
            <option value="360">360p</option>
            <option value="240">240p</option>
            <option value="144">144p</option>
          </select>

          <button id="yt-dlp-ok">OK</button>

      </div>

      <div id="yt-dlp-how-to-you">
        <h1>How to use?</h1>
        <div id="yt-dlp-description">

          <div id="yt-dlp-d1">

        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-square-check">
	<path stroke="none" d="M0 0h24v24H0z" fill="none" />
	<path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14" />
	<path d="M9 12l2 2l4 -4" />
</svg>
<p>Paste your YouTube video link</p>
</div>  

<div id="yt-dlp-d2">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-edit">
	<path stroke="none" d="M0 0h24v24H0z" fill="none" />
	<path d="M7 7h-1a2 2 0 0 0 -2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2 -2v-1" />
	<path d="M20.385 6.585a2.1 2.1 0 0 0 -2.97 -2.97l-8.415 8.385v3h3l8.385 -8.415" />
	<path d="M16 5l3 3" />
</svg>
<p>Select format, resolution and click OK</p>
</div>

<div id="yt-dlp-d3">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-database">
	<path stroke="none" d="M0 0h24v24H0z" fill="none" />
	<path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" />
	<path d="M4 6v6a8 3 0 0 0 16 0v-6" />
	<path d="M4 12v6a8 3 0 0 0 16 0v-6" />
</svg>
<p>The final video will be downloaded automatically</p>
  
</div>

</div>
      </div>
        </div>
      </div>
    </div>

  </section>
    </main>  
    <script src="script.js" type="module"></script>
</body>
</html>
